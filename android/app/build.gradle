plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.maksaline.local_slm"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    androidResources {
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    defaultConfig {
        applicationId = "com.maksaline.local_slm"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    flavorDimensions "default"

    productFlavors {
        development {
            dimension "default"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            manifestPlaceholders = [
                appName: "Local SLM Dev"
            ]
        }
        staging {
            dimension "default"
            applicationIdSuffix ".stg"
            versionNameSuffix "-stg"
            manifestPlaceholders = [
                appName: "Local SLM Staging"
            ]
        }
        production {
            dimension "default"
            manifestPlaceholders = [
                appName: "Local SLM"
            ]
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

// Apply after `./flutterfire.config.sh <flavor> <project-id>` creates
// android/app/src/<flavor>/google-services.json for each flavor.
def hasGoogleServices = ["development", "staging", "production"].any { flavor ->
    file("src/${flavor}/google-services.json").exists()
}
if (hasGoogleServices) {
    apply plugin: "com.google.gms.google-services"
}
